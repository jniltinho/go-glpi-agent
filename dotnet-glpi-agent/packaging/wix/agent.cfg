# Dotnet GLPI Agent default configuration (first install only).
# This file lives next to dotnet-glpi-agent.exe; user edits survive upgrades,
# repairs, and normal uninstall. State/logs/inventories stay under ProgramData.
# Secrets must never be supplied as ordinary MSI properties; use Set-AgentSecret.ps1.

# When SERVER is omitted, the service writes local inventories so it can start.
local = C:\ProgramData\DotnetGlpiAgent\inventories
delaytime = 3600
logger = file
logfile = C:\ProgramData\DotnetGlpiAgent\logs\agent.log
vardir = C:\ProgramData\DotnetGlpiAgent\state
