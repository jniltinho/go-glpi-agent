name: Dotnet GLPI Agent CI

on:
  push:
    paths:
      - 'dotnet-glpi-agent/**'
      - '.github/workflows/dotnet.yml'
      - '.github/workflows/dotnet-release.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'dotnet-glpi-agent/**'
      - '.github/workflows/dotnet.yml'
      - '.github/workflows/dotnet-release.yml'
      - '.github/workflows/release.yml'

defaults:
  run:
    working-directory: dotnet-glpi-agent

jobs:
  linux-unit:
    name: Restore / build / test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet-glpi-agent/global.json

      - name: Restore
        run: dotnet restore DotnetGlpiAgent.sln

      - name: Format
        run: dotnet format DotnetGlpiAgent.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DotnetGlpiAgent.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test DotnetGlpiAgent.sln --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Schema fixtures present
        run: |
          test -f test/glpi/artifacts/glpi10/inventory.schema.json
          test -f test/glpi/artifacts/glpi11/inventory.schema.json

      - name: Dependency list (SBOM snapshot)
        run: |
          mkdir -p artifacts
          dotnet list DotnetGlpiAgent.sln package --include-transitive | tee artifacts/sbom-dotnet-packages.txt

      - name: Vulnerable package check
        run: |
          mkdir -p artifacts
          set +e
          out=$(dotnet list DotnetGlpiAgent.sln package --vulnerable --include-transitive 2>&1)
          set -e
          printf '%s\n' "$out" | tee artifacts/vulnerable-packages.txt
          if printf '%s\n' "$out" | grep -qi 'has the following vulnerable packages'; then
            echo "Vulnerable packages detected" >&2
            exit 1
          fi
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: |
            dotnet-glpi-agent/**/TestResults/**
            dotnet-glpi-agent/artifacts/sbom-dotnet-packages.txt
          if-no-files-found: ignore

  windows-publish:
    name: Publish win-x64 + MSI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet-glpi-agent/global.json

      - name: Restore
        working-directory: dotnet-glpi-agent
        run: dotnet restore DotnetGlpiAgent.sln

      - name: Test
        working-directory: dotnet-glpi-agent
        run: dotnet test DotnetGlpiAgent.sln --configuration Release --no-restore

      - name: Publish self-contained win-x64
        working-directory: dotnet-glpi-agent
        run: >
          dotnet publish src/DotnetGlpiAgent.App/DotnetGlpiAgent.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/publish/win-x64

      - name: Inspect publish output
        working-directory: dotnet-glpi-agent
        run: |
          Get-ChildItem artifacts/publish/win-x64 | Select-Object -First 20 Name, Length
          if (-not (Test-Path artifacts/publish/win-x64/dotnet-glpi-agent.exe)) { throw 'missing exe' }

      - name: Build MSI
        working-directory: dotnet-glpi-agent
        run: >
          dotnet build packaging/wix/DotnetGlpiAgent.Package.wixproj
          --configuration Release
          -p:ProductVersion=0.5.0
          -p:SkipPublishAgent=true

      - name: Inspect MSI artifacts
        working-directory: dotnet-glpi-agent
        run: |
          Get-ChildItem artifacts/msi | Format-Table Name, Length
          if (-not (Get-ChildItem artifacts/msi -Filter *.msi)) { throw 'MSI not produced' }
          if (-not (Get-ChildItem artifacts/msi -Filter *.UNSIGNED.txt)) { throw 'unsigned marker missing' }

      - name: Release artifact bundle
        working-directory: dotnet-glpi-agent
        shell: bash
        run: VERSION=0.5.0 bash packaging/scripts/New-ReleaseArtifacts.sh

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-msi-unsigned
          path: |
            dotnet-glpi-agent/artifacts/msi/**
            dotnet-glpi-agent/artifacts/release/**
            dotnet-glpi-agent/artifacts/publish/win-x64/dotnet-glpi-agent.exe
            dotnet-glpi-agent/artifacts/publish/win-x64/dotnet-glpi-agent.deps.json

  secret-scan-smoke:
    name: Secret pattern smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject credential-like MSI properties in authoring
        working-directory: dotnet-glpi-agent
        run: |
          if grep -E 'Property Id="(PASSWORD|PROXY_PASSWORD|CLIENT_CERT_PASSWORD)"' packaging/wix/Package.wxs; then
            echo "Secret MSI properties must not be authored" >&2
            exit 1
          fi
          if grep -RInE 'password\s*=\s*[^#\s]' packaging/wix/agent.cfg; then
            echo "Default agent.cfg must not embed passwords" >&2
            exit 1
          fi

  lab-docs-gate:
    name: Lab documentation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require lab docs and orchestrator
        working-directory: dotnet-glpi-agent
        run: |
          test -f test/vagrant-windows/README.md
          test -f test/vagrant-windows/Vagrantfile
          test -x test/vagrant-windows/run-lab.sh
          test -f test/glpi/lab.sh
          test -f docs/msi-packaging.md
          test -f docs/product-decisions.md
          grep -q 'WiX Toolset SDK 4.0.6' docs/product-decisions.md
